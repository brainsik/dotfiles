"$schema" = 'https://starship.rs/config-schema.json'

format = '$hostname$username$all'

[character]
success_symbol = '[❯](cyan)'

[username]
style_user = "bold green"
detect_env_vars = ['!SSH_CONNECTION', 'SUDO_USER']

[hostname]
ssh_symbol = "📞 "
style = "bold bright-purple"
format = '[$ssh_symbol$hostname]($style) ← '

[localip]
disabled = false
ssh_only = false
style = "bright-black"

[time]
disabled = false
format = "[$time]($style) "

[direnv]
symbol = " "
disabled = false

[[battery.display]]
threshold = 10
style = "red"
[[battery.display]]
threshold = 20
style = "purple"
[[battery.display]]
threshold = 40
style = "yellow"

[git_status]
modified = "!${count}"
staged= "+${count}"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"

[memory_usage]
symbol = "󰍛 "
disabled = false

[python]
symbol = " "
format = '''via [${symbol}${pyenv_prefix}(${version} )(
🌯 $virtualenv )]($style)'''

[shlvl]
symbol = "󰹍 "
disabled = false

[sudo]
disabled = false

[directory]
read_only = " 󰌾"
repo_root_style = 'bold'

